name: Build & Release ParqBench

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated test suite
        run: |
          python -m pytest

      - name: Install Inno Setup compiler
        run: |
          choco install innosetup --no-progress

      - name: Generate brand icons and assets
        run: |
          python generate_assets.py

      - name: Extract application version
        id: get_version
        shell: pwsh
        run: |
          $ver = (python -c "import src; print(src.__version__)").Trim()
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Application Version: $ver"

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --clean -y ParqBench.spec

      - name: Compile Inno Setup non-admin installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\parqbench_setup.iss

      - name: Package portable ZIP archive
        shell: pwsh
        run: |
          $zipName = "dist/ParqBench-v${{ env.VERSION }}-windows-x64-portable.zip"
          Compress-Archive -Path dist/ParqBench/* -DestinationPath $zipName -Force
          Write-Host "Created $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "ParqBench v${{ env.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/installer/ParqBench-Setup-x64.exe
            dist/ParqBench-v${{ env.VERSION }}-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
